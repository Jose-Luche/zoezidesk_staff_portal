name: zoezidesk_staff
description: "ZoeziDesk Staff app: front desk, trainers and gym managers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  # Tokens, the shared-device credential and preferences
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  # Idempotency-Key per user action
  uuid: ^4.6.0
  flutter_svg: ^2.3.0
  # Scanning members' QR codes at the front desk
  mobile_scanner: ^7.4.2
  # Calling and WhatsApp-ing members from the follow-up list
  url_launcher: ^6.3.3
  # App notifications (Firebase Cloud Messaging)
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  # Offline check-ins: the member list in a file, QR codes matched by hash
  path_provider: ^2.1.5
  crypto: ^3.0.6
  # Member photos at the desk
  image_picker: ^1.2.1
  # Lucide icons; the 600 weight is the design's heavy stroke
  lucide_icons_flutter: 3.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # Caprasimo (display and headings) and Figtree (body and UI), bundled so
  # the app looks right offline. Both OFL; licences next to the files.
  fonts:
    - family: Caprasimo
      fonts:
        - asset: assets/fonts/Caprasimo-Regular.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
  assets:
    - assets/logo/zoezi-desk-horizontal-dark.svg
    - assets/logo/zoezi-desk-horizontal-light.svg
    - assets/logo/zoezi-desk-horizontal-organic-dark.svg
    - assets/logo/zoezi-desk-horizontal-organic-light.svg
