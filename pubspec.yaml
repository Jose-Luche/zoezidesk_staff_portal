name: zoezidesk_staff
description: "ZoeziDesk Staff app: front desk, trainers and gym managers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  # Tokens, the shared-device credential and preferences
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  # Idempotency-Key per user action
  uuid: ^4.6.0
  flutter_svg: ^2.3.0
  # Scanning members' QR codes at the front desk
  mobile_scanner: ^7.4.2
  # Calling and WhatsApp-ing members from the follow-up list
  url_launcher: ^6.3.3
  # App notifications (Firebase Cloud Messaging)
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  # Offline check-ins: the member list in a file, QR codes matched by hash
  path_provider: ^2.1.5
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # Barlow (body) and Barlow Condensed (headings), bundled like the members
  # app so the app looks right offline.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
  assets:
    - assets/logo/zoezi-desk-horizontal-dark.svg
    - assets/logo/zoezi-desk-horizontal-light.svg
